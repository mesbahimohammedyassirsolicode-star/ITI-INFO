    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">

        {
          "@type": "Question",
          "name": "Quelles formations propose l'Institut ITI à Tanger ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'Institut ITI propose des diplômes de Technicien Spécialisé en Gestion de la Navigation & Logistique et en Gestion des Entreprises (2 ans), ainsi que des formations continues en Programmation Web (6 mois), Comptabilité (4 mois), Bureautique et Logiciels Comptables (SAGE, SAP)."

        {
          "@type": "Question",
          "name": "L'Institut ITI est-il accrédité par l'État ?",
          "acceptedAnswer": {
            "@type": "Answer",

        },
        {
          "@type": "Question",
          "name": "Comment s'inscrire pour la session 2026-2027 ?",

            "text": "Les inscriptions se font en ligne via le formulaire de candidature sur le site. Notre équipe d'admission vous contactera dans les 24 heures. Vous pouvez aussi appeler au 05 39 93 95 37."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la durée des formations à l'ITI ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les diplômes de Technicien Spécialisé durent 2 ans. Les formations continues varient de 4 à 6 mois. Les formations pratiques sont de courte durée, adaptées aux professionnels."

        },

          "@type": "Question",
